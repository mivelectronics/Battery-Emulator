CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# The link UART runs on DMA (console and Modbus stay interrupt driven)
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CLOCK_CONTROL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
CONFIG_REBOOT=y

# Settings in NVS on the storage partition of the code flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Modbus RTU server (SCADA / Home Assistant)
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_SERIAL=y
# Our settings live at 5000+, the address where float extensions would otherwise start
CONFIG_MODBUS_FP_EXTENSIONS=n

# eDMA descriptors in non-cached SRAM, not in DTCM. With descriptors in DTCM (read through the
# backdoor at 0x2100xxxx) the channel stopped with a source bus error at every scatter-gather
# switch while the CPU was reloading: SADDR held the last word of the descriptor (measured on
# FRDM-A-S32K312). DMAs that do not chain are not affected. Non-cached memory needs the MPU.
CONFIG_ARM_MPU=y
CONFIG_DMA_MCUX_USE_DTCM_FOR_DMA_DESCRIPTORS=n
CONFIG_NOCACHE_MEMORY=y
