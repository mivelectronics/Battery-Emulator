# MCUboot on the S32K312 (OTA_PLAN.md)

# Our module (s32k/modules/miv_boot): the MPU map against the speculative access hang, and SWT0 started
# here with 10 s and fed during the swap, through the registers like be_wdt.c
CONFIG_MIV_BOOT_HOOKS=y

# Small and quiet: its console would be the Modbus port of the emu_mb variant
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_SIZE_OPTIMIZATIONS=y

# The MPU on, with the map of be_mpu.c (the module adds it): without it the Cortex-M7 runs on the
# background map, where the speculative access hang of this chip (ERR011573) can happen
CONFIG_ARM_MPU=y
CONFIG_CPU_HAS_CUSTOM_FIXED_SOC_MPU_REGIONS=y
