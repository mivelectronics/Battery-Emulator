# The application under MCUboot (tools/build_ota.sh adds this file)

# The boot header belongs to MCUboot now
CONFIG_BOARD_NXP_MCXE31X_BOOT_HEADER=n
# The MCUboot header in front of the vector table is 4 KB: ROM_START_OFFSET cannot be set under
# MCUboot, and the SoC sets 0x1000

# Confirming the running image (boot_write_img_confirmed) and marking slot 1 for a test start
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
