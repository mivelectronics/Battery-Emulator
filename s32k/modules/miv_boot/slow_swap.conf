# Test build for the power-cut tests (tools/build_ota.sh prodslow), never a release: MCUboot logs on the
# console (LPUART6, the application's console in the prod variant) and swaps slowly with the red LED blinking.
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_MIV_BOOT_SLOW_SWAP=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
# 9 ms per step: a swap of a 547 KB image takes about 40 s (3 949 steps measured at 3 ms: 17 s)
CONFIG_MIV_BOOT_SLOW_SWAP_US=9000
